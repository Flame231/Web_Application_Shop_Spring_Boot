<html>
<head>
    <title>Регистрация нового пользователя</title>
    <style>
        /* Стиль для всей формы */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;           /* Вертикальный отступ между строками */
            max-width: 500px;    /* Максимальная ширина формы */
            margin-top: 20px;
        }

        /* Сетка для каждой строки: делает из нее две ровные колонки */
        .form-row {
            display: grid;
            /* 180px отдаем под названия, всё оставшееся место (1fr) под поля ввода */
            grid-template-columns: 180px 1fr;
            align-items: center; /* Центрируем текст и инпут по вертикали */
        }

        /* Красивые отступы внутри самих полей ввода */
        .form-row input {
            padding: 6px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Чтобы кнопка отправки не растягивалась на всю ширину */
        input[type="submit"] {
            width: max-content;
            padding: 8px 25px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Регистрация нового пользователя</h1>
<a th:href="@{/login}">На главную</a>

<form th:action="@{/saveOrUpdateUser}" method="post">
    <!-- Скрытое поле лежит отдельно от разметки сетки, чтобы не ломать структуру -->
    <input type="hidden" name="oldPassword" value="0">

    <div class="form-row">
        <label>Имя:</label>
        <input name="name" type="text" />
    </div>

    <div class="form-row">
        <label>Логин:</label>
        <input name="login" type="text" />
    </div>

    <div class="form-row">
        <label>Пароль:</label>
        <input name="newPassword" type="password" />
    </div>

    <div class="form-row">
        <label>Подтвердите пароль:</label>
        <input name="newPasswordRepeat" type="password" />
    </div>

    <div class="form-row">
        <label>День Рождения:</label>
        <input name="birthday" type="date" />
    </div>

    <div class="form-row">
        <label>Способ Оплаты:</label>
        <input name="paymentMethods" type="text" />
    </div>

    <input type="submit" value="Сохранить"/>
</form>

</body>
</html>
