<style>

    table {
        width: 50%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
    }

    {
        display: grid
    ;
        grid-template-columns: 120px 300px
    ;
        gap: 15px
    ;
        align-items: center
    ;
    }
</style>
<html>
<head>
        <a th:href="@{/client/accountClient}">Вернуться в личный кабинет</a>
    <h1>Мои Заказы</h1>
    <title>Мои Заказы</title>
    <br>
    <br>
</head>
<body>
<th:block th:each="userOrderDTO: ${userOrderDTOList}">

    <div>Номер заказа:<span th:text="${userOrderDTO.getOrderId()}"></span>
    </div>
    <br>
    <div>Статус заказа:<span th:text="${userOrderDTO.getOrderStatus().getDescription()}"></span>
    </div>
    <br>
    <div>Пункт выдачи: <span th:text="${userOrderDTO.getOrderPoint()}"></span>
    </div>
    <br>
    <div>Сумма заказа: <span th:text="${userOrderDTO.getOrderSum()}"></span>
    </div>
    <br>
    <div>Дата создания: <span th:text="${userOrderDTO.getOrderCreateDateTime()}"></span>
    </div>
    <br>

    <table>
        <thead>
        <tr>
            <th>Название товара</th>
            <th>Цена</th>
            <th>Количество</th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="orderDTO : ${userOrderDTO.getUserOrderProducts()}">

            <td><span th:text="${orderDTO.getProductDTO().getProductName()}"></span>
            </td>

            <td>
                <span th:text="${orderDTO.getProductDTO().getPrice()}"></span>
            </td>

            <td>
                <span th:text="${orderDTO.getProductCount()}"></span>
            </td>
        </tr>
        </tbody>
    </table>
    <br>
    <br>
    <br>
    <br>

</th:block>

</body>
</html>
