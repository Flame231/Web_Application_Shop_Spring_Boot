<head>
    <meta charset="UTF-8">
    <title>Каталог товаров</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 120px 300px;
            gap: 15px;
            align-items: center;
        }
    </style>
</head>
<body>

<a th:href="@{/client/accountClient}">Вернуться в личный кабинет</a>
<h1>Каталог товаров</h1>
<form th:action="@{/client/bag}" method="get">
    <input type="submit" value="Корзина">
</form>
Сумма в корзине:
<span th:text="${bagSum}"></span>

<table>
    <thead>
    <tr>
        <th>Номер товара</th>
        <th>Название</th>
        <th>Категория</th>
        <th>Цена</th>
        <th>Продавец</th>
        <th>В корзине</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="productDTO : ${productDTOList.content()}">
        <td th:text="${productDTO.getId()}"></td>
        <td th:text="${productDTO.getProductName()}"></td>
        <td th:text="${productDTO.getProductCategory().getCategory()}"></td>
        <td th:text="${productDTO.getPrice()}"></td>
        <td th:text="${productDTO.getSeller().getSellerName()}"></td>
        <td>
            <form method="post">
                <input type="submit" formmethod="post" th:formaction="@{/client/addProductToBag}" value="+">
                <input type="hidden" th:name="productId" th:value="${productDTO.getId()}">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <input type="hidden" th:name="page" th:value="${productDTOList.currentPage() - 1}">

                <th:block th:each="bagDTO : ${bagDTOResponseList}">
                    <span th:if="${bagDTO.getProductDTO().getId() == productDTO.getId()}"
                          th:text="${bagDTO.getCount()}"></span>
                    <input th:if="${bagDTO.getProductDTO().getId() == productDTO.getId()}" type="hidden" th:name="productId"
                           th:value="${bagDTO.getProductDTO().getId()}">
                </th:block>
                <input type="submit" formmethod="post" th:formaction="@{/client/deleteProductFromBag}" value="-">
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/client/catalog(page=0)}">В начало</a>

<span style="font-size: 20px" th:if="${(productDTOList.currentPage() - 1) > 0}"
      th:each="i : ${#numbers.sequence(((productDTOList.currentPage() - 1) - 3 > 0 ? (productDTOList.currentPage() - 1) - 3 : 0), (productDTOList.currentPage() - 1) - 1)}">
    <a th:href="@{/client/catalog(page=${i})}" th:text="${i}"></a>
</span>

<span style="font-size: 24px" th:text="${productDTOList.currentPage() - 1}"></span>

<span style="font-size: 20px" th:if="${(productDTOList.currentPage() - 1) < productDTOList.totalPages() - 1}"
      th:each="i : ${#numbers.sequence((productDTOList.currentPage() - 1) + 1, ((productDTOList.currentPage() - 1) + 3 < productDTOList.totalPages() - 1 ? (productDTOList.currentPage() - 1) + 3 : productDTOList.totalPages() - 1))}">
    <a th:href="@{/client/catalog(page=${i})}" th:text="${i}"></a>
</span>

<a th:href="@{/client/catalog(page=${productDTOList.totalPages() - 1})}">В конец</a>

<form th:action="@{/client/catalog}">
    <select name="pageSize">
        <option th:each="pageSizelist : ${pageSizeList}"
                th:text="${pageSizelist}"
                th:value="${pageSizelist}"
                th:selected="${pageSizelist == pageSize}"></option>
    </select>
    <input type="submit" value="Подтвердить">
    <input type="hidden" name="page" value="0"/>
</form>
</body>
</html>
