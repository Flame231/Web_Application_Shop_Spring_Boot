<head>
    <meta charset="UTF-8">
    <title>Каталог товаров</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 120px 300px;
            gap: 15px;
            align-items: center;
        }
    </style>
</head>
<body>

<a th:href="@{/client/accountClient}">Вернуться в личный кабинет</a>
<h1>Каталог товаров</h1>
<form th:action="@{/client/bag}" method="get">
    <input type="submit" value="Корзина">
</form>
Сумма в корзине:
<span th:text="${#numbers.formatDecimal(bagSum.fullPrice, 1, 'DEFAULT', 2, 'DEFAULT')}"></span>
<br>
Ваша скидка:
<span th:text="${#numbers.formatDecimal(bagSum.discountValue, 1, 'DEFAULT', 2, 'DEFAULT')}"></span>%
<br>
Сумма скидки:
<span th:text="${#numbers.formatDecimal(bagSum.calculatedDiscount, 1, 'DEFAULT', 2, 'DEFAULT')}"></span>
<br>
Сумма в корзине с учётом скидки:
<span th:text="${#numbers.formatDecimal(bagSum.priceWithDiscount, 1, 'DEFAULT', 2, 'DEFAULT')}"></span>
<br>
<th:block th:if="${successMessage}">
    <span style="color: #069e29" th:text="${successMessage}"></span>
    <br>
    <br>
</th:block>
<table>
    <thead>
    <tr>
        <th>Номер товара</th>
        <th>Название</th>
        <th>Категория</th>
        <th>Цена</th>
        <th>Продавец</th>
        <th>В корзине</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="productDTO : ${productDTOList.content()}">
        <td th:text="${productDTO.getId()}"></td>
        <td th:text="${productDTO.getProductName()}"></td>
        <td th:text="${productDTO.getProductCategory().getCategory()}"></td>
        <td th:text="${#numbers.formatDecimal(productDTO.price, 1, 'DEFAULT', 2, 'DEFAULT')}"></td>
        <td th:text="${productDTO.getSeller().getSellerName()}"></td>
        <td>
            <form method="post">
                <input type="submit" formmethod="post" th:formaction="@{/client/addProductToCatalogBag}" value="+">
                <input type="hidden" th:name="productId" th:value="${productDTO.getId()}">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <input type="hidden" th:name="page" th:value="${productDTOList.currentPage()}">

                <th:block th:each="bagDTO : ${bagDTOResponseList}">
                    <span th:if="${bagDTO.getProductDTO().getId() == productDTO.getId()}"
                          th:text="${bagDTO.getCount()}"></span>
                    <input th:if="${bagDTO.getProductDTO().getId() == productDTO.getId()}" type="hidden"
                           th:name="productId"
                           th:value="${bagDTO.getProductDTO().getId()}">
                </th:block>
                <input type="submit" formmethod="post" th:formaction="@{/client/deleteProductFromCatalogBag}" value="-">
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{|${clientPath}catalog|(page=1, pageSize=${pageSize})}">В начало</a>

<span style="font-size: 20px"
      th:if="${productDTOList.currentPage > 1}"
      th:each="i : ${#numbers.sequence((productDTOList.currentPage - 3 > 1 ? productDTOList.currentPage - 3 : 1), productDTOList.currentPage - 1)}">
    <a th:href="@{|${clientPath}catalog|(page=${i}, pageSize=${pageSize})}" th:text="${i}"></a>
</span>

<span style="font-size: 24px" th:text="${productDTOList.currentPage}"></span>

<span style="font-size: 20px"
      th:if="${productDTOList.currentPage < productDTOList.totalPages}"
      th:each="i : ${#numbers.sequence(productDTOList.currentPage + 1, (productDTOList.currentPage + 3 < productDTOList.totalPages ? productDTOList.currentPage + 3 : productDTOList.totalPages))}">
    <a th:href="@{|${clientPath}catalog|(page=${i}, pageSize=${pageSize})}" th:text="${i}"></a>
</span>
<a th:href="@{|${clientPath}catalog|(page=${productDTOList.totalPages}, pageSize=${pageSize})}">В конец</a>

<form th:action="@{/client/catalog}">
    <select name="pageSize">
        <option th:each="pageSizelist : ${pageSizeList}"
                th:text="${pageSizelist}"
                th:value="${pageSizelist}"
                th:selected="${pageSizelist == pageSize}"></option>
    </select>
    <input type="submit" value="Подтвердить">
</form>
</body>
</html>
