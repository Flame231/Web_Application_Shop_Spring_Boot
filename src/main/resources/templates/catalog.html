<style xmlns:th="http://www.w3.org/1999/html">

    table {
        width: 50%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
    }

    {
        display: grid
    ;
        grid-template-columns: 120px 300px
    ;
        gap: 15px
    ;
        align-items: center
    ;
    }
</style>
<html>
<head>

    <a th:href="@{/client/accountClient}">Вернуться в личный кабинет</a>
    <title>Каталог товаров</title>
    <h1>Каталог товаров</h1>
    <form th:action="@{/client/bag}" method="get">
        <input type="submit" value="Корзина">
    </form>

</head>
<body>

<table>
    <thead>
    <tr>
        <th>Номер товара</th>
        <th>Название</th>
        <th>Категория</th>
        <th>Цена</th>
        <th>Продавец</th>
        <th>В корзине</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="productDTO:${productDTOList}">
        <td th:text="${productDTO.getId()}">
        </td>
        <td th:text="${productDTO.getProductName()}">
        </td>
        <td th:text="${productDTO.getProductCategory().getCategory()}">
        </td>
        <td th:text="${productDTO.getPrice()}">
        </td>
        <td th:text="${productDTO.getSeller().getSellerName()}">
        </td>
        <td>
            <form method="post">
                <input type="submit" formmethod="post" th:formaction="@{/addProductToBag}" value="+">
                <input type="hidden" th:name="productId" th:value="${productDTO.getId()}">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:name="page" th:value="${productDTOList.getNumber()}">
                <th:block th:each="bagDTO:${bagDTOResponseList}">
                    <span th:if="${bagDTO.getProductDTO.getId()==productDTO.getId()}"
                          th:text="${bagDTO.getCount()}"></span>
                    <input th:if="${bagDTO.getProductDTO.getId()==productDTO.getId()}" type="hidden" th:name="productId"
                           th:value="${bagDTO.getProductDTO().getId()}">
                </th:block>
                <input type="submit" formmethod="post" th:formaction="@{/deleteProductFromBag}" value="-">
            </form>

            <!--  <form method="post" th:action="@{/deleteProductFromBag}">
                  <input type="submit" value="-">
                  <input type="hidden" th:name="userId" th:value="${#authentication.principal.id}">
                  <input type="hidden" th:name="productId" th:value="${productDTO.getId()}">
              </form>-->

            <!--       В корзине:<%=value%>
                   <form action="<%=request.getContextPath() + ADD_TO_BAG%>" method="post">
                       <input type="hidden" name="productId" value="<%= productDTO.getId()%>"/>
                       <input type="hidden" name="count" value="1">
                       <input type="submit" name="plusProduct" value="+">
                       <input type="hidden" name="func" value="catalog">
                       <input type="hidden" name="currentPage" value="<%=currentPage%>">
                   </form>
                   <form action="<%=request.getContextPath() + ADD_TO_BAG%>" method="post">
                       <input type="hidden" name="productId" value="<%= productDTO.getId()%>"/>
                       <input type="hidden" name="count" value="-1">
                       <input type="submit" name="minusProduct" value="-">
                       <input type="hidden" name="func" value="catalog">
                       <input type="hidden" name="currentPage" value="<%=currentPage%>">
                   </form>-->
        </td>
    </tr>
    </tbody>
</table>
<!--
<%
    int productCountResult = (int) request.getAttribute("productCountResult");
    int lastPage = productCountResult / PRODUCT_PER_PAGE;
    int minPage = currentPage - 3;
    int maxPage = currentPage + 3;
    if (minPage < 1) {
        minPage = 1;
    }

    if (productCountResult % PRODUCT_PER_PAGE != 0) {
        lastPage = lastPage + 1;
    }
    if (maxPage > lastPage) {
        maxPage = lastPage;
    }%>-->
<a th:href="@{/client/catalog(page=0)}">В начало</a>
<span style="font-size: 20px" th:if="${productDTOList.getNumber()>0}"
      th:each="i : ${#numbers.sequence((productDTOList.getNumber()-3>0?productDTOList.getNumber()-3:0),productDTOList.getNumber()-1)}">
    <a th:href="@{/client/catalog(page=${i})}"
       th:text="${i}"></a>
    </span>
<span style="font-size: 24px" th:text="${productDTOList.getNumber()}"></span>
<span style="font-size: 20px" th:if="${productDTOList.getNumber()<productDTOList.getTotalPages()-1}"
      th:each="i : ${#numbers.sequence(productDTOList.getNumber()+1,(productDTOList.getNumber()+3<productDTOList.getTotalPages()-1?productDTOList.getNumber()+3:productDTOList.getTotalPages()-1))}">
    <a th:href="@{/client/catalog(page=${i})}"
       th:text="${i}"></a>
    </span>
<a th:href="@{/client/catalog(page=${productDTOList.getTotalPages()-1})}">В конец</a>

<form th:action="@{/client/catalog}">
    <select name="pageSize">
        <option th:each="pageSizelist:${pageSizeList}"
                th:text="${pageSizelist}"
                th:value="${pageSizelist}"
                th:selected="${pageSizelist == pageSize}"></option>
    </select>
    <input type="submit" value="Подтвердить">
</form>
</body>
</html>
