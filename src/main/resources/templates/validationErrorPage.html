<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Ошибка валидации</title>
</head>
<body>
<h2>Ошибка валидации</h2>
<div sec:authorize="hasRole('ADMINISTRATOR')">
    <a th:href="@{|${adminPath}accountAdministrator|}">Вернуться на главную страницу</a>
</div>
<div sec:authorize="hasRole('OPERATOR')">
    <a th:href="@{|${operatorPath}accountOperator|}">Вернуться на главную страницу</a>
</div>
<div sec:authorize="hasRole('CLIENT')">
    <a th:href="@{|${clientPath}accountClient|}">Вернуться на главную страницу</a>
</div>
<div sec:authorize="isAnonymous()">
    <a th:href="@{/login}">Вернуться на главную страницу</a>
</div>
<ul style="list-style-type: none; padding-left: 0;">
    <li th:each="m : ${message}" th:text="${m}"></li>
</ul>
</body>
</html>
