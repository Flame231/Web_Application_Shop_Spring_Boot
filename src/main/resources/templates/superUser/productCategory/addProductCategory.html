<html>
<head>
    <title>Редактировать категорию</title>
</head>
<body>
<a th:href="@{|${adminPath}accountAdministrator|}">Вернуться в личный кабинет</a>
<h1>Добавить категорию</h1>
<a th:href="@{|${adminPath}editProductCategories|}">Назад</a>
<form method="post" th:action="@{|${adminPath}addNewProductCategory|}">
    <div>
        Название категории:
        <input type="text" name="category"/>
    </div>
    <input type="submit" value="Подтвердить"/>
</form>
</body>
</html>
