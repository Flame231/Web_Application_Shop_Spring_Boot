<style>

    table {
        width: 50%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
    }

    {
        display: grid
    ;
        grid-template-columns: 120px 300px
    ;
        gap: 15px
    ;
        align-items: center
    ;
    }
</style>
<html>
<head>
    <a th:href="@{/accountAdministrator}">Вернуться в личный кабинет</a>
    <title>Редактировать категории товаров</title>
    <h1>Категории</h1>
</head>
<body>
<a th:href="@{/addProductCategory}">
    Добавить категорию
</a>
<table>
    <thead>
    <tr>
        <th>Номер категории товара</th>
        <th>Категория</th>
        <th>Редактировать</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="productCategoryDTO:${productCategoriesList}">
        <td th:text="${productCategoryDTO.getId()}">
        </td>

        <td th:text="${productCategoryDTO.getCategory()}">>
        </td>

        <td>
            <form method="post">
                <input type="submit" value="Редактировать"
                       formaction="<%=request.getContextPath() + EDIT_PRODUCT_CATEGORY%>">
            </form>
            <form method="post" th:action="@{/deleteProductCategory/{id}(id=${productCategoryDTO.id})}">
                <input type="submit" value="удалить">
            </form>
        </td>
    </tr>
    </tbody>
</table>


<a th:href="@{/editProductCategories(page=1)}">В начало</a>
<span style="font-size: 20px" th:if="${productCategoriesList.getNumber()>0}"
      th:each="i : ${#numbers.sequence((productCategoriesList.getNumber()-3>0?productCategoriesList.getNumber()-3:0),productCategoriesList.getNumber()-1)}">
    <a th:href="@{/editProductCategories(page=${i})}"
       th:text="${i}"></a>
    </span>
<span style="font-size: 24px" th:text="${productCategoriesList.getNumber()}"></span>
<span style="font-size: 20px" th:if="${productCategoriesList.getNumber()<productCategoriesList.getTotalPages()-1}"
      th:each="i : ${#numbers.sequence(productCategoriesList.getNumber()+1,(productCategoriesList.getNumber()+3<productCategoriesList.getTotalPages()-1?productCategoriesList.getNumber()+3:productCategoriesList.getTotalPages()-1))}">
    <a th:href="@{/editProductCategories(page=${i})}"
       th:text="${i}"></a>
    </span>
<a th:href="@{/editProductCategories(page=${productCategoriesList.getTotalPages()-1})}">В конец</a>

</body>
</html>
