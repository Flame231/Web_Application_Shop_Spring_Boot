<style>

    table {
        width: 50%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
    }

    {
        display: grid
    ;
        grid-template-columns: 120px 300px
    ;
        gap: 15px
    ;
        align-items: center
    ;
    }
</style>
<html>
<head>
    <form action="<%=request.getContextPath() + MAIN_PAGE_ADMINISTRATOR%>" method="post">
        <input type="submit" value="Вернуться в личный кабинет">
    </form>
    <title>Редактировать каталог</title>
    <h1>Редактировать каталог товаров</h1>
</head>
<body>
<form action="<%=request.getContextPath() + ADD_PRODUCT_PAGE%>" method="post">
    <input type="submit" value="Добавить товар в каталог">
</form>
<table>
    <thead>
    <tr>
        <th>Номер товара</th>
        <th>Название</th>
        <th>Категория</th>
        <th>Цена</th>
        <th>Продавец</th>
        <th>Редактировать</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="productDTO:${productDTOList}">
        <td th:text="${productDTO.getId()}">
        </td>
        <td th:text="${productDTO.getProductName()}">
        </td>
        <td th:text="${productDTO.getProductCategory()}">
        </td>
        <td th:text="${productDTO.getPrice()}">
        </td>
        <td th:text="${productDTO.getSeller().getSellerName()}">
        </td>
        <td>
            <form method="post">
                <input type="hidden" name="productId" value="<%=productDTO.getId()%>">
                <input type="hidden" name="func" value="catalog">
                <input type="hidden" name="currentPage" value="<%=currentPage%>">
                <input type="submit" value="Редактировать" formaction="<%=request.getContextPath() + EDIT_PRODUCT%>"/>
                <input type="submit" value="Удалить" formaction="<%=request.getContextPath() + REMOVE_PRODUCT%>"/>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</html>
