<style>

    table {
        width: 50%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
    }

    {
        display: grid
    ;
        grid-template-columns: 120px 300px
    ;
        gap: 15px
    ;
        align-items: center
    ;
    }
</style>
<html>
<head>
    <a th:href="@{/administrator/accountAdministrator}">Вернуться в личный кабинет</a>
    <title>Редактировать каталог</title>
    <h1>Редактировать каталог товаров</h1>
</head>
<body>
<a th:href="@{/administrator/addProduct}">Добавить товар</a>

<table>
    <thead>
    <tr>
        <th>Номер товара</th>
        <th>Название</th>
        <th>Категория</th>
        <th>Цена</th>
        <th>Продавец</th>
        <th>Редактировать</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="productDTO:${productDTOList}">
        <td th:text="${productDTO.getId()}">
        </td>
        <td><a th:href="@{/productPage/{id}(id=${productDTO.id})}"
               th:text="${productDTO.getProductName()}"></a>
        </td>
        <td th:text="${productDTO.getProductCategory().getCategory()}">
        </td>
        <td th:text="${productDTO.getPrice()}">
        </td>
        <td th:text="${productDTO.getSeller().getSellerName()}">
        </td>
        <td>
            <form method="get" th:action="@{/administrator/editProduct/{id}(id=${productDTO.id})}">
                <input type="submit" value="Редактировать"/>
            </form>
            <form method="post" th:action="@{/administrator/deleteProduct/{id}(id=${productDTO.id})}">
                <input type="submit" value="Удалить"/>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<a th:href="@{/administrator/editCatalog(page=0)}">В начало</a>
<span style="font-size: 20px" th:if="${productDTOList.getNumber()>0}"
      th:each="i : ${#numbers.sequence((productDTOList.getNumber()-3>0?productDTOList.getNumber()-3:0),productDTOList.getNumber()-1)}">
    <a th:href="@{/administrator/editCatalog(page=${i})}"
       th:text="${i}"></a>
    </span>
<span style="font-size: 24px" th:text="${productDTOList.getNumber()}"></span>
<span style="font-size: 20px" th:if="${productDTOList.getNumber()<productDTOList.getTotalPages()-1}"
      th:each="i : ${#numbers.sequence(productDTOList.getNumber()+1,(productDTOList.getNumber()+3<productDTOList.getTotalPages()-1?productDTOList.getNumber()+3:productDTOList.getTotalPages()-1))}">
    <a th:href="@{/administrator/editCatalog(page=${i})}"
       th:text="${i}"></a>
    </span>
<a th:href="@{/administrator/editCatalog(page=${productDTOList.getTotalPages()-1})}">В конец</a>
</body>
</html>
