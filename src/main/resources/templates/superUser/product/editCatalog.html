<style>

    table {
        width: 50%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
    }

    {
        display: grid
    ;
        grid-template-columns: 120px 300px
    ;
        gap: 15px
    ;
        align-items: center
    ;
    }
</style>
<html>
<head>
    <a th:href="@{/accountAdministrator}">Вернуться в личный кабинет</a>
    <title>Редактировать каталог</title>
    <h1>Редактировать каталог товаров</h1>
</head>
<body>
<a th:href="@{/addProduct}">Добавить товар</a>

<table>
    <thead>
    <tr>
        <th>Номер товара</th>
        <th>Название</th>
        <th>Категория</th>
        <th>Цена</th>
        <th>Продавец</th>
        <th>Редактировать</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="productDTO:${productDTOList}">
        <td th:text="${productDTO.getId()}">
        </td>
        <td><a th:href="@{/productPage/{id}(id=${productDTO.id})}"
               th:text="${productDTO.getProductName()}"></a>
        </td>
        <td th:text="${productDTO.getProductCategory().getCategory()}">
        </td>
        <td th:text="${productDTO.getPrice()}">
        </td>
        <td th:text="${productDTO.getSeller().getSellerName()}">
        </td>
        <td>
            <form method="get" th:action="@{/editProduct/{id}(id=${productDTO.id})}">
                <input type="submit" value="Редактировать"/>
            </form>
            <form method="post" th:action="@{/deleteProduct/{id}(id=${productDTO.id})}">
                <input type="submit" value="Удалить"/>
            </form>

        </td>
    </tr>
    </tbody>
</table>

<a th:if="${productDTOList.getNumber()>0}" th:href="@{/editCatalog(page=${productDTOList.getNumber()-1})}">Назад</a>

<span th:if="${productDTOList.getNumber()>0}"
      th:each="i : ${#numbers.sequence((productDTOList.getNumber()-3>0?productDTOList.getNumber()-3:0),productDTOList.getNumber()-1)}">
    <a th:href="@{/editCatalog(page=${i})}"
       th:text="${i}"></a>
    </span>
<span th:text="${productDTOList.getNumber()}"></span>


<span th:if="${productDTOList.getNumber()<productDTOList.getTotalPages()-1}"
      th:each="i : ${#numbers.sequence(productDTOList.getNumber()+1,(productDTOList.getNumber()+3<productDTOList.getTotalPages()-1?productDTOList.getNumber()+3:productDTOList.getTotalPages()-1))}">
    <a th:href="@{/editCatalog(page=${i})}"
       th:text="${i}"></a>
    </span>

<a th:if="${productDTOList.getNumber()<productDTOList.getTotalPages()-1}" th:href="@{/editCatalog(page=${productDTOList.getNumber()+1})}">Вперёд</a>


</body>
</html>
