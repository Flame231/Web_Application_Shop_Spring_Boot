<html>
<head>
    <title>Добавить продавца</title>
</head>
<body>
<a th:href="@{/administrator/accountAdministrator}">Вернуться в личный кабинет</a>
<h1>Добавить товар в каталог</h1>
<a th:href="@{/administrator/sellersList}">Назад</a>
<br>
<form th:object="${sellerDTO}" th:action="@{/administrator/addNewSeller}" method="post">

    <div>
        Название продавца:
        <input type="text" th:field="*{sellerName}">
    </div>
    <div>
        Адрес продавца:
        <input type="text" th:field="*{sellerAddress}">
    </div>
    <input type="submit" value="Подтвердить">
</form>
</body>
</html>
