<style>

    table {
        width: max-content;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
    }

    {
        display: grid
    ;
        grid-template-columns: 120px 300px
    ;
        gap: 15px
    ;
        align-items: center
    ;
    }
</style>
<html>
<head>
    <a th:href="@{|${adminPath}accountAdministrator|}">Вернуться в личный кабинет</a>
    <title>Редактировать продавцов</title>
    <h1>Редактировать продавцов</h1>

</head>
<body>
<a th:href="@{|${adminPath}addSeller|}">Добавить продавца</a>
<br>
<br>
<th:block th:if="${successMessage}">
    <span style="color: #069e29" th:text="${successMessage}"></span>
    <br>
    <br>
</th:block>
</form>
<table>
    <thead>
    <tr>
        <th>Номер продавца</th>
        <th>Название продавца</th>
        <th>Адрес</th>
        <th>Статус</th>
        <th>Редактировать</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="sellerDTO:${sellerDTOList.content()}">
        <td th:text="${sellerDTO.getId()}">
        </td>
        <td th:text="${sellerDTO.getSellerName()}">
        </td>
        <td th:text="${sellerDTO.getSellerAddress()}">
        </td>
        <td th:text="${sellerDTO.getStatus.getDescription()}">
        </td>
        <td>
            <form method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <th:block th:if="${sellerDTO.getStatus().name()=='ACTIVE'}">
                    <input th:formmethod="get"
                           th:formaction="@{|${adminPath}editSeller/${sellerDTO.id}|}" type="submit"
                           value="Редактировать"/>
                    <input th:formaction="@{|${adminPath}deleteSeller/${sellerDTO.id}|}" type="submit"
                           value="Удалить"/>
                </th:block>
                <th:block th:unless="${sellerDTO.getStatus().name()=='ACTIVE'}">
                    <input th:formaction="@{|${adminPath}recoverSeller/${sellerDTO.id}|}" type="submit"
                           value="Восстановить"/>
                </th:block>
            </form>
    </tr>
    </tbody>
</table>

<a th:href="@{|${adminPath}sellersList|(page=1, pageSize=${pageSize})}">В начало</a>
<span style="font-size: 20px"
      th:if="${sellerDTOList.currentPage > 1}"
      th:each="i : ${#numbers.sequence((sellerDTOList.currentPage - 3 > 1 ? sellerDTOList.currentPage - 3 : 1), sellerDTOList.currentPage - 1)}">
    <a th:href="@{|${adminPath}sellersList|(page=${i}, pageSize=${pageSize})}" th:text="${i}"></a>
</span>
<span style="font-size: 24px" th:text="${sellerDTOList.currentPage}"></span>
<span style="font-size: 20px"
      th:if="${sellerDTOList.currentPage < sellerDTOList.totalPages}"
      th:each="i : ${#numbers.sequence(sellerDTOList.currentPage + 1, (sellerDTOList.currentPage + 3 < sellerDTOList.totalPages ? sellerDTOList.currentPage + 3 : sellerDTOList.totalPages))}">
    <a th:href="@{|${adminPath}sellersList|(page=${i}, pageSize=${pageSize})}" th:text="${i}"></a>
</span>

<a th:href="@{|${adminPath}sellersList|(page=${sellerDTOList.totalPages}, pageSize=${pageSize})}">В конец</a>

<form th:action="@{/administrator/sellersList}">
    <select name="pageSize">
        <option th:each="pageSizelist : ${pageSizeList}"
                th:text="${pageSizelist}"
                th:value="${pageSizelist}"
                th:selected="${pageSizelist == pageSize}"></option>
    </select>
    <input type="submit" value="Подтвердить">
    <input type="hidden" name="page" value="1"/>
</form>
</body>
</html>
