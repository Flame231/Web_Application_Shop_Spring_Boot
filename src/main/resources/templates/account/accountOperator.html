<html>
<head>
    <title>Личный кабинет</title>
    <style>
        .form-container {
            display: flex;
            flex-direction: column;
            width: 400px;
            gap: 15px;
            margin-top: 20px;
        }

        {
            display: flex
        ;
            justify-content: space-between
        ;
            align-items: center
        ;
        }

        input {
            width: 60%;
            box-sizing: border-box;
            padding: 5px;
        }

        input[type="submit"] {
            width: auto;
            align-self: flex-start;
            padding: 8px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Интернет-магазин</h1>
<h2>Оператор</h2>
<form method="post" th:action="@{/logout}">
    <input type="submit" value="выйти из кабинета">
</form>
<form th:action="@{/operator/readyOrders}" method="get">
    <input type="submit" value="Доставленные заказы">
</form>
<form th:action="@{/operator/orders}" method="get">
    <input type="submit" value="Заказы">
</form>

</body>
</html>
