<html>
<head>
    <title>Личный кабинет</title>
    <style>
        .form-container {
            display: flex;
            flex-direction: column;
            width: 400px;
            gap: 15px;
            margin-top: 20px;
        }

        {
            display: flex
        ;
            justify-content: space-between
        ;
            align-items: center
        ;
        }

        input {
            width: 60%;
            box-sizing: border-box;
            padding: 5px;
        }

        input[type="submit"] {
            width: auto;
            align-self: flex-start;
            padding: 8px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Интернет-магазин</h1>
<h2>Пользователь</h2>
<form method="post" th:action="@{/logout}">
    <input type="submit" value="выйти из кабинета">
</form>
<form method="post">
    <input type="submit" formmethod="get" th:formaction="@{|${clientPath}catalog|}" value="Просмотреть каталог товаров">
    <input type="submit" formmethod="get" th:formaction="@{|${clientPath}userOrders|}" value="Мои заказы">
    <input type="submit" formmethod="get" th:formaction="@{|${clientPath}ordersHistory|}" value="История заказов">
    <input type="submit" formmethod="get" th:formaction="@{|${clientPath}userProfile|}" value="Посмотреть профиль">
</form>
</body>
</html>
