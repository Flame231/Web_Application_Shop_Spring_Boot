<head>
    <title>Личный кабинет</title>
    <style>
        .form-container {
            display: flex;
            flex-direction: column;
            width: 400px;
            gap: 15px;
            margin-top: 20px;
        }

        {
            display: flex
        ;
            justify-content: space-between
        ;
            align-items: center
        ;
        }

        input {
            width: 60%;
            box-sizing: border-box;
            padding: 5px;
        }

        input[type="submit"] {
            width: auto;
            align-self: flex-start;
            padding: 8px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Интернет-магазин</h1>
<h2>Пользователь</h2>

<th:block th:object="${userDiscountDTO}">
    <div>
        Сумма покупок:
        <span th:text="${#numbers.formatDecimal(userDiscountDTO.sumOfPurchases, 1, 'DEFAULT', 2, 'DEFAULT')}"></span>
    </div>
    <div>
        Общая скидка:
        <span th:text="${userDiscountDTO.discount}"></span>%
    </div>
</th:block>
<th:block th:if="${successMessage}">
    <span style="color: #069e29" th:text="${successMessage}"></span>
    <br>
    <br>
</th:block>
<form method="post" th:action="@{/logout}">
    <input type="submit" value="выйти из кабинета">
</form>
<a style="font-size: 20px" th:href="@{|${clientPath}catalog|}">Просмотреть каталог товаров</a>
<span style="font-weight: bold; margin: 0 10px;">|</span>
<a style="font-size: 20px" th:href="@{|${clientPath}userOrders|}">Мои заказы</a>
<span style="font-weight: bold; margin: 0 10px;">|</span>
<a style="font-size: 20px" th:href="@{|${clientPath}ordersHistory|}">История заказов</a>
<span style="font-weight: bold; margin: 0 10px;">|</span>
<a style="font-size: 20px" th:href="@{|${clientPath}userProfile|}">Посмотреть профиль</a>

</body>
</html>
