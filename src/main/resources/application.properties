spring.application.name=springBoot
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/ShopSpringBoot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.mvc.view.prefix=/templates/
spring.mvc.view.suffix=.html
spring.thymeleaf.cache=false
error.message=Error, input data
spring.liquibase.change-log=classpath:/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
adminPath=/administrator/
clientPath=/client/
operatorPath=/operator/
spring.data.web.pageable.one-indexed-parameters=true
logging.level.java.org.example.webApplicationShopSpringBoot.service.user.UserServiceImpl=info



